# Lighthouse CI — Advisory Monitor (not a gate)
#
# All assertions are set to "warn" level. This workflow collects Lighthouse
# metrics and uploads results as artifacts for manual review. It never fails
# the build. To upgrade to gating status checks:
#   1. Install the Lighthouse CI GitHub App: https://github.com/apps/lighthouse-ci
#   2. Add the LHCI_GITHUB_APP_TOKEN secret
#   3. Upgrade desired assertions from "warn" to "error" in lighthouserc.json
name: Lighthouse CI

on:
  push:
    branches: [master]
    paths:
      - website/**
      - lighthouserc.json
      - .github/workflows/lighthouse.yml
  pull_request:
    branches: [master]
    paths:
      - website/**
      - lighthouserc.json
      - .github/workflows/lighthouse.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-results-${{ github.sha }}
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload LHCI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-ci-results-${{ github.run_number }}-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
