# Forgejo-native CI — consolidated port of `.github/workflows/ci.yml`, part of
# the Forgejo-primary migration (2026-10-25, plan W3/W4).
#
# GitHub Actions has been billing-dead since 2026-09-08, so this is the only
# leg actually executing. Dual-run with the GitHub workflow until the Forgejo
# leg completes its burn-in; `.github/workflows/` is deleted in the cutover
# commit (plan W10) — never before this workflow has gone green on a real push.
#
# Runner: native host (evo-x2), label `native` — nix 2.34 + go 1.26.8 + node 24
# are on the unit PATH. Everything Go rides the flake (go_1_27) because the
# host `go` is 1.26.8 and this module requires 1.27 (GOTOOLCHAIN=local forbids
# a toolchain download). nix run/nix shell inherit the runner's warm
# GOMODCACHE/GOCACHE env (unit Environment=), so module and build caches stay
# warm across runs. The five GitHub jobs (test, vulncheck, lint, dedup, docs)
# consolidate into one job: the capacity-2 runner serves the whole instance,
# and sequential nix evals share the eval cache.
name: ci

on:
  push:
    branches: [master]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - testdata/**
      - .golangci.yml
      - .golangci.yaml
      - flake.nix
      - flake.lock
      - plugin/**
      - scripts/check-markdown-links.py
      - README.md
      - doc.go
      - website/src/data/generators.json
      - website/src/content/docs/generators.mdx
      - website/src/content/docs/api/detection.mdx
      - .forgejo/workflows/ci.yml
  pull_request:
    branches: [master]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - testdata/**
      - .golangci.yml
      - .golangci.yaml
      - flake.nix
      - flake.lock
      - plugin/**
      - scripts/check-markdown-links.py
      - README.md
      - doc.go
      - website/src/data/generators.json
      - website/src/content/docs/generators.mdx
      - website/src/content/docs/api/detection.mdx
      - .forgejo/workflows/ci.yml
  workflow_dispatch:
  schedule:
    # Weekly canary (Wednesday 04:12 UTC): a missing run is a CI-outage signal
    # — the GitHub billing outage of 2026-09-08 went unnoticed until manual
    # inspection. Same heartbeat pattern as domains/.forgejo/workflows/ci.yml.
    - cron: "12 4 * * 3"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: nix gates — test, race+coverage, lint, plugin, dedup, docs, vulncheck
    runs-on: native
    timeout-minutes: 45
    steps:
      # v4.2.2 — the only checkout line PROVEN on this runner (v7.0.1 dies at
      # clone auth; see eventcatalog-hub/.forgejo/workflows/build.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Flake checks (sandboxed build + tests + treefmt)
        run: nix flake check

      - name: Build + vet
        run: |
          nix run .#build
          nix run .#vet

      - name: Race detector (full suite)
        run: nix run .#test-race

      - name: Coverage (root package, ≥98% gate — awk, the runner has no bc)
        run: |
          set -euo pipefail
          nix shell nixpkgs#go_1_27 -c bash -c \
            'go test -covermode=atomic -coverprofile=coverage.out .'
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { gsub(/%/, "", $3); print $3 }')
          if awk -v t="$total" 'BEGIN { exit !(t + 0 >= 98.0) }'; then
            echo "Coverage ${total}% meets the 98% threshold"
          else
            echo "::error::Coverage ${total}% is below the 98% threshold"
            exit 1
          fi

      - name: Lint (golangci-lint v2 via flake — version kept in lockstep with devshell + GitHub CI)
        run: nix run .#lint

      - name: Plugin module tests (separate Go module, GOWORK=off)
        run: |
          nix shell nixpkgs#go_1_27 nixpkgs#gcc -c bash -c \
            'cd plugin && GOWORK=off go test ./...'

      - name: Code duplication (art-dupl v0.1.0 — v0.3.0 is broken upstream, TODO_LIST)
        run: |
          set -euo pipefail
          export GOBIN="$PWD/.tools"
          nix shell nixpkgs#go_1_27 -c bash -c 'go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.1.0'
          .tools/art-dupl --semantic -t 15 \
            --exclude-pattern 'testdata/moq/**' \
            --exclude-pattern 'sqlc.go'

      - name: Generated docs freshness (gendocs table is the source of truth)
        run: |
          nix run .#gendocs
          if ! git diff --exit-code -- README.md doc.go website/src/data/generators.json website/src/content/docs/generators.mdx website/src/content/docs/api/detection.mdx; then
            echo "::error::Generated docs are stale. Run 'nix run .#gendocs' (or go generate ./...) and commit the changes."
            git diff --stat
            exit 1
          fi

      - name: Internal markdown links
        run: python3 scripts/check-markdown-links.py

      - name: Vulnerability scan (govulncheck)
        run: nix run .#vulncheck
