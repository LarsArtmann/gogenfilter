version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - noinlineerr
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/bmatcuk/doublestar/v4
            - github.com/go-faster/yaml
            - github.com/LarsArtmann/gogenfilter
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct_v5:
      ignore-patterns:
        - .*/fstest\.MapFile
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocognit:
      min-complexity: 25
    goconst:
      ignore-tests: true
      min-len: 4
      min-occurrences: 5
    gocritic:
      disabled-checks:
        - ifElseChain
    gocyclo:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-files:
        - _test\.go
    nestif:
      min-complexity: 6
    revive:
      rules:
        - disabled: true
          name: exported
        - disabled: true
          name: package-comments
    tagalign:
      align: false
      order:
        - binding
        - json
        - yaml
        - xml
        - toml
        - validate
        - mapstructure
      sort: true
    tagliatelle:
      case:
        rules:
          yaml: snake
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - tc
        - f
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-sig-regexps:
        - encoding/json
        - fmt\.
        - errors\.
        - slices\.
        - maps\.
        - sort\.
        - time\.
        - net/http
        - os\.
        - io\.
        - strings\.
        - strconv\.
        - path\.
        - filepath\.
        - compress/gzip
        - \(context\.Context\)\.Err
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - goconst
          - gocyclo
          - maintidx
          - revive
          - testpackage
          - exhaustruct
          - gochecknoglobals
          - forcetypeassert
          - gosec
          - errcheck
          - wrapcheck
          - ireturn
          - recvcheck
          - contextcheck
          - exhaustive
          - exhaustruct_v5
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - \.pb\.go$
      - ^testdata/ent/client\.go$
      - ^testdata/go-swagger/user\.go$
      - ^testdata/gqlgen/generated\.go$
      - ^testdata/sqlc/
      - _easyjson\.go$
      - _enum\.go$
      - _gen\.go$
      - _mock\.go$
      - _moq\.go$
      - _string\.go$
      - _templ\.go$
      - fake_.*\.go$
      - mock_.*\.go$
      - testdata/counterfeiter/
      - testdata/easyjson/
      - testdata/ent/
      - testdata/go-swagger/
      - testdata/gqlgen/
      - testdata/mockery/
      - testdata/msgp/
      - testdata/sqlc/
      - vendor/
      - wire_gen\.go$
      - zz_generated\..*\.go$
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
    - swaggo
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - \.gen\.go$
      - \.pb\.go$
      - ^testdata/ent/client\.go$
      - ^testdata/go-swagger/user\.go$
      - ^testdata/gqlgen/generated\.go$
      - ^testdata/sqlc/
      - _easyjson\.go$
      - _enum\.go$
      - _gen\.go$
      - _mock\.go$
      - _moq\.go$
      - _string\.go$
      - _templ\.go$
      - fake_.*\.go$
      - mock_.*\.go$
      - testdata/counterfeiter/
      - testdata/easyjson/
      - testdata/ent/
      - testdata/go-swagger/
      - testdata/gqlgen/
      - testdata/mockery/
      - testdata/msgp/
      - testdata/sqlc/
      - wire_gen\.go$
      - zz_generated\..*\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
